<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autor | Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">📚</span>
        <a th:href="@{/}" class="nav-title">Biblioteca</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">Início</a></li>
        <li><a th:href="@{/livros}">Livros</a></li>
        <li><a th:href="@{/autores}" class="active">Autores</a></li>
        <li><a th:href="@{/categorias}">Categorias</a></li>
        <li><a th:href="@{/relatorio}">📊 Relatórios</a></li>
    </ul>
</nav>
<main class="main-content">
    <div class="page-header">
        <h1 th:text="${autor.id != null ? '✏️ Editar Autor' : '✍️ Novo Autor'}">Autor</h1>
        <a th:href="@{/autores}" class="btn btn-outline">← Voltar</a>
    </div>

    <div class="form-container">
        <form th:action="@{/autores/salvar}" th:object="${autor}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                       placeholder="Ex: Machado de Assis">
                <span class="error-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-group">
                <label for="nacionalidade">Nacionalidade</label>
                <input type="text" id="nacionalidade" th:field="*{nacionalidade}" class="form-control"
                       placeholder="Ex: Brasileiro">
            </div>

            <div class="form-group">
                <label for="biografia">Biografia</label>
                <textarea id="biografia" th:field="*{biografia}" class="form-control" rows="4"
                          placeholder="Breve biografia do autor..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Salvar</button>
                <a th:href="@{/autores}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer class="footer"><p>&copy; 2024 Sistema de Biblioteca</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
