<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros | Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">📚</span>
        <a th:href="@{/}" class="nav-title">Biblioteca</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">Início</a></li>
        <li><a th:href="@{/livros}" class="active">Livros</a></li>
        <li><a th:href="@{/autores}">Autores</a></li>
        <li><a th:href="@{/categorias}">Categorias</a></li>
        <li><a th:href="@{/relatorio}">📊 Relatórios</a></li>
    </ul>
</nav>
<main class="main-content">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="page-header">
        <h1>📖 Livros</h1>
        <a th:href="@{/livros/novo}" class="btn btn-primary">+ Novo Livro</a>
    </div>

    <div class="search-bar">
        <form th:action="@{/livros}" method="get">
            <input type="text" name="busca" placeholder="Buscar por título..." th:value="${busca}" class="search-input">
            <button type="submit" class="btn btn-outline">Buscar</button>
            <a th:href="@{/livros}" class="btn btn-ghost" th:if="${busca != null}">Limpar</a>
        </form>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoria</th>
                    <th>Ano</th>
                    <th>ISBN</th>
                    <th>Páginas</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${livros.isEmpty()}">
                    <td colspan="8" class="empty-state">Nenhum livro cadastrado ainda.</td>
                </tr>
                <tr th:each="livro : ${livros}">
                    <td th:text="${livro.id}"></td>
                    <td><strong th:text="${livro.titulo}"></strong></td>
                    <td th:text="${livro.autor.nome}"></td>
                    <td>
                        <span class="badge badge-category" th:text="${livro.categoria.nome}"></span>
                    </td>
                    <td th:text="${livro.anoPublicacao}"></td>
                    <td class="isbn" th:text="${livro.isbn}"></td>
                    <td th:text="${livro.numeroPaginas != null ? livro.numeroPaginas : '-'}"></td>
                    <td class="actions-cell">
                        <a th:href="@{'/livros/editar/' + ${livro.id}}" class="btn-sm btn-edit">Editar</a>
                        <a th:href="@{'/livros/deletar/' + ${livro.id}}"
                           class="btn-sm btn-delete"
                           onclick="return confirm('Tem certeza que deseja deletar este livro?')">Deletar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer class="footer"><p>&copy; 2024 Sistema de Biblioteca</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
