<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria | Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <span class="nav-icon">📚</span>
        <a th:href="@{/}" class="nav-title">Biblioteca</a>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/}">Início</a></li>
        <li><a th:href="@{/livros}">Livros</a></li>
        <li><a th:href="@{/autores}">Autores</a></li>
        <li><a th:href="@{/categorias}" class="active">Categorias</a></li>
        <li><a th:href="@{/relatorio}">📊 Relatórios</a></li>
    </ul>
</nav>
<main class="main-content">
    <div class="page-header">
        <h1 th:text="${categoria.id != null ? '✏️ Editar Categoria' : '🏷️ Nova Categoria'}">Categoria</h1>
        <a th:href="@{/categorias}" class="btn btn-outline">← Voltar</a>
    </div>

    <div class="form-container">
        <form th:action="@{/categorias/salvar}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" th:field="*{nome}" class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                       placeholder="Ex: Ficção Científica">
                <span class="error-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="3"
                          placeholder="Descrição da categoria..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Salvar</button>
                <a th:href="@{/categorias}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</main>
<footer class="footer"><p>&copy; 2024 Sistema de Biblioteca</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
